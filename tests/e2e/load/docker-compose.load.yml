# 카프카 대용량 특성 실증용 부하 스택 (Phase 1 — 컨슈머 측 직접 주입).
#
# 목적: "버스트 흡수(랙 상승→하강) / 컨슈머 수평 확장 / 사가 수렴 지연" 을 로컬에서 측정.
# backend(프로듀서 HTTP)는 포함하지 않는다 — drawing-completed 를 Kafka 로 직접 대량 주입한다.
#
# 스케일링 실증: notification 컨슈머(발송+비용 통합)를 profile 로 1개(기본) → 3개(--profile scale)로 늘린다.
# 세 인스턴스가 같은 groupId(drawing-notification)로 6개 파티션을 나눠 갖는다.

x-consumer-base: &consumer-base
    image: eclipse-temurin:17-jre
    networks: [load-net]
    depends_on:
        load-kafka: { condition: service_started }
        load-mysql: { condition: service_healthy }
        load-redis: { condition: service_started }
    environment: &consumer-env
        SERVER_PORT: 8080
        SPRING_KAFKA_BOOTSTRAP_SERVERS: load-kafka:9092
        SPRING_KAFKA_ADMIN_FAIL_FAST: "false"
        SPRING_DATASOURCE_URL: jdbc:mysql://load-mysql:3306/test?allowPublicKeyRetrieval=true&useSSL=false
        SPRING_DATASOURCE_USERNAME: root
        SPRING_DATASOURCE_PASSWORD: rootpw
        SPRING_DATA_REDIS_HOST: load-redis
        SPRING_DATA_REDIS_PORT: 6379
        SPRING_DATA_REDIS_PASSWORD: ""
        JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
        OTEL_TRACES_EXPORTER: none
        OTEL_METRICS_EXPORTER: none
        OTEL_LOGS_EXPORTER: none
    command: java -jar /app/app.jar

services:
    load-kafka:
        image: apache/kafka:3.8.0
        container_name: load-kafka
        networks: [load-net]
        ports: ["29092:9092"]
        environment:
            KAFKA_NODE_ID: "1"
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@load-kafka:9093
            KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://load-kafka:9092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
            KAFKA_NUM_PARTITIONS: "6"          # 스케일링 실증: 자동생성 토픽을 6파티션으로 → 최대 6컨슈머 병렬
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
            KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
            KAFKA_MIN_INSYNC_REPLICAS: "1"
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

    load-mysql:
        image: mysql:8.0
        container_name: load-mysql
        networks: [load-net]
        ports: ["23307:3306"]
        environment:
            MYSQL_ROOT_PASSWORD: rootpw
            MYSQL_DATABASE: test
        command: ["--max_connections=500"]
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpw"]
            interval: 5s
            timeout: 5s
            retries: 20

    load-redis:
        image: redis:7
        container_name: load-redis
        networks: [load-net]

    # ── 사가를 완결시키기 위한 나머지 컨슈머 ──
    dlt:
        <<: *consumer-base
        volumes:
            - ../../../module-dlt-sms-notification-consumer/build/libs/dlt-sms-notification-consumer-0.0.1-SNAPSHOT.jar:/app/app.jar:ro

    # ── 측정 대상: notification 컨슈머 — 발송+비용 통합 (스케일링 실증) ──
    notification-1:
        <<: *consumer-base
        environment:
            <<: *consumer-env
            SMS_MOCK_FAILURE_RATE: "0.0"    # 전량 성공 → 전량 CONFIRMED (회계 정확성 검증에 유리)
        volumes:
            - ../../../module-drawing-sms-notification-consumer/build/libs/drawing-sms-notification-consumer-0.0.1-SNAPSHOT.jar:/app/app.jar:ro

    notification-2:
        <<: *consumer-base
        profiles: ["scale"]
        environment:
            <<: *consumer-env
            SMS_MOCK_FAILURE_RATE: "0.0"
        volumes:
            - ../../../module-drawing-sms-notification-consumer/build/libs/drawing-sms-notification-consumer-0.0.1-SNAPSHOT.jar:/app/app.jar:ro

    notification-3:
        <<: *consumer-base
        profiles: ["scale"]
        environment:
            <<: *consumer-env
            SMS_MOCK_FAILURE_RATE: "0.0"
        volumes:
            - ../../../module-drawing-sms-notification-consumer/build/libs/drawing-sms-notification-consumer-0.0.1-SNAPSHOT.jar:/app/app.jar:ro

networks:
    load-net:
        name: sms-saga-load-net
