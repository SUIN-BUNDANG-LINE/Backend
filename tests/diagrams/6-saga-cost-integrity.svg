<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#495057"/>
    </marker>
    <marker id="arwp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9C36B5"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#FBFCFE"/>

  <text x="30" y="40" font-size="24" font-weight="700" fill="#1A1B1E">⑥ saga-cost-integrity — SMS 발송·비용 정합 사가 불변식</text>
  <text x="30" y="64" font-size="13" fill="#868E96">실제 추첨 API 로 당첨/비당첨 대량 생성 → 컨슈머 사가가 cost_record 를 수렴 → xk6-sql 로 불변식 4종 직접 검증</text>

  <!-- producer -->
  <rect x="30" y="92" width="150" height="70" rx="12" fill="#EDF2FF" stroke="#3B5BDB"/>
  <text x="105" y="120" font-size="13" font-weight="700" fill="#1A1B1E" text-anchor="middle">drawingPhase</text>
  <text x="105" y="140" font-size="11" fill="#495057" text-anchor="middle">당첨 EXPECTED_</text>
  <text x="105" y="155" font-size="11" fill="#495057" text-anchor="middle">WINNERS 생성</text>

  <line x1="180" y1="127" x2="250" y2="127" stroke="#9C36B5" stroke-width="1.8" marker-end="url(#arwp)"/>
  <text x="215" y="118" font-size="10" fill="#9C36B5" text-anchor="middle">drawing-completed</text>

  <!-- cost consumer creates PENDING -->
  <rect x="250" y="92" width="170" height="70" rx="12" fill="#E6FCF5" stroke="#099268"/>
  <text x="335" y="118" font-size="12.5" font-weight="700" fill="#1A1B1E" text-anchor="middle">cost consumer</text>
  <text x="335" y="140" font-size="11" fill="#495057" text-anchor="middle">cost_record 생성</text>
  <text x="335" y="156" font-size="11" fill="#E8590C" text-anchor="middle">state = PENDING</text>

  <line x1="420" y1="127" x2="490" y2="127" stroke="#9C36B5" stroke-width="1.8" marker-end="url(#arwp)"/>

  <!-- notification consumer sends SMS -->
  <rect x="490" y="92" width="180" height="70" rx="12" fill="#E6FCF5" stroke="#099268"/>
  <text x="580" y="118" font-size="12.5" font-weight="700" fill="#1A1B1E" text-anchor="middle">notification consumer</text>
  <text x="580" y="140" font-size="11" fill="#495057" text-anchor="middle">SMS 발송 시도</text>
  <text x="580" y="156" font-size="11" fill="#495057" text-anchor="middle">SMS_MOCK_FAILURE_RATE</text>

  <!-- branch success -->
  <path d="M670,110 C740,100 760,100 800,100" fill="none" stroke="#2F9E44" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="740" y="92" font-size="10.5" fill="#2F9E44">발송 성공</text>
  <rect x="800" y="80" width="140" height="48" rx="10" fill="#EBFBEE" stroke="#2F9E44"/>
  <text x="870" y="100" font-size="12" font-weight="700" fill="#2F9E44" text-anchor="middle">CONFIRMED</text>
  <text x="870" y="118" font-size="10" fill="#495057" text-anchor="middle">confirmed 이벤트 수신</text>

  <!-- branch fail -->
  <path d="M670,148 C740,170 760,175 800,175" fill="none" stroke="#E03131" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="712" y="192" font-size="10.5" fill="#E03131">MAX_RETRY=5 소진 → DLT</text>
  <rect x="800" y="152" width="140" height="48" rx="10" fill="#FFF5F5" stroke="#E03131"/>
  <text x="870" y="172" font-size="12" font-weight="700" fill="#E03131" text-anchor="middle">REVERSED</text>
  <text x="870" y="190" font-size="10" fill="#495057" text-anchor="middle">permanently-failed 보상</text>

  <!-- mode band -->
  <rect x="30" y="222" width="910" height="60" rx="10" fill="#FFF9DB" stroke="#F0C000"/>
  <text x="48" y="246" font-size="13" font-weight="700" fill="#1A1B1E">EXPECT_MODE</text>
  <text x="48" y="270" font-size="12" fill="#495057">failure-rate 0.0 → confirmed(전건 CONFIRMED, 수초 수렴)   ·   1.0 → reversed(전건 REVERSED, 재시도 소진 ~분)   ·   혼합 → any(불변식만)</text>

  <!-- invariants -->
  <text x="30" y="318" font-size="15" font-weight="700" fill="#1A1B1E">teardown — 사가 수렴 폴링(SAGA_TIMEOUT) 후 불변식 검증 (위반 0건이 게이트)</text>

  <g>
    <rect x="30" y="336" width="440" height="86" rx="10" fill="#F8F9FA" stroke="#DEE2E6"/>
    <text x="50" y="362" font-size="13" font-weight="700" fill="#3B5BDB">INV1 · 유실/중복 0</text>
    <text x="50" y="386" font-size="12" fill="#495057">당첨 수 == CONFIRMED + REVERSED</text>
    <text x="50" y="408" font-size="11" fill="#868E96">정확히 1회 처리 (FR-005 / SC-004)</text>

    <rect x="490" y="336" width="450" height="86" rx="10" fill="#F8F9FA" stroke="#DEE2E6"/>
    <text x="510" y="362" font-size="13" font-weight="700" fill="#3B5BDB">INV2 · 수렴 완료</text>
    <text x="510" y="386" font-size="12" fill="#495057">PENDING(final) == 0</text>
    <text x="510" y="408" font-size="11" fill="#868E96">모든 사가가 종결 상태로 전이</text>

    <rect x="30" y="434" width="440" height="86" rx="10" fill="#F8F9FA" stroke="#DEE2E6"/>
    <text x="50" y="460" font-size="13" font-weight="700" fill="#3B5BDB">INV3 · 비당첨 미과금</text>
    <text x="50" y="484" font-size="12" fill="#495057">cost_record 총행 == 당첨 수</text>
    <text x="50" y="506" font-size="11" fill="#868E96">비당첨은 행이 없음 (FR-004)</text>

    <rect x="490" y="434" width="450" height="86" rx="10" fill="#F8F9FA" stroke="#DEE2E6"/>
    <text x="510" y="460" font-size="13" font-weight="700" fill="#3B5BDB">INV4 · 실제 발송분만 과금</text>
    <text x="510" y="484" font-size="12" fill="#495057">청구액 == SUM(amount WHERE CONFIRMED)</text>
    <text x="510" y="506" font-size="11" fill="#868E96">= CONFIRMED × 단가(8.00원)</text>
  </g>

  <text x="30" y="556" font-size="12" fill="#495057" font-weight="700">게이트 threshold: saga_invariant_violations == 0</text>
  <text x="30" y="578" font-size="11" fill="#868E96">메트릭: saga_confirmed_final · saga_reversed_final · saga_converge_ms · drawing_win/lose/fail_total</text>
  <text x="30" y="600" font-size="11" fill="#868E96">사가엔 조회 REST 가 없어 cost_record 를 SQL 로 직접 집계·검증한다 (setup 시 TRUNCATE 로 이 실행분만 계수)</text>
</svg>
