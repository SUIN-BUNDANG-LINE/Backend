<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#495057"/>
    </marker>
    <marker id="arwp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9C36B5"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#FBFCFE"/>

  <text x="30" y="40" font-size="24" font-weight="700" fill="#1A1B1E">⑧ run-load.sh — Kafka 버스트 부하 · 수평 확장 실증</text>
  <text x="30" y="64" font-size="13" fill="#868E96">drawing-completed N건(기본 8000)을 한꺼번에 주입 → notification 컨슈머(발송+비용 통합) 1개 vs 3개의 랙 소진 시간을 비교</text>

  <!-- proof goals -->
  <rect x="30" y="82" width="900" height="70" rx="10" fill="#FFF9DB" stroke="#F0C000"/>
  <text x="48" y="106" font-size="12.5" fill="#495057">① 버스트 흡수: 랙이 치솟았다 0으로 drain   ② 프로듀서 비차단: 주입 처리량이 컨슈머 적체와 무관</text>
  <text x="48" y="130" font-size="12.5" fill="#495057">③ 수평 확장: notification 1개 → 3개로 늘리면 drawing-completed 랙 drain 시간 단축   ④ 사가 수렴: 전건 CONFIRMED 소요</text>

  <!-- experiment A -->
  <g transform="translate(0,172)">
    <rect x="30" y="0" width="440" height="180" rx="12" fill="#F8F9FA" stroke="#DEE2E6"/>
    <text x="50" y="28" font-size="15" font-weight="700" fill="#1A1B1E">실험 A · notification × 1</text>

    <rect x="50" y="44" width="90" height="44" rx="8" fill="#F8F0FC" stroke="#9C36B5"/>
    <text x="95" y="63" font-size="11" fill="#495057" text-anchor="middle">버스트 N건</text>
    <text x="95" y="79" font-size="11" fill="#495057" text-anchor="middle">주입</text>
    <line x1="140" y1="66" x2="185" y2="66" stroke="#9C36B5" stroke-width="1.8" marker-end="url(#arwp)"/>
    <rect x="185" y="44" width="110" height="44" rx="8" fill="#F8F0FC" stroke="#9C36B5"/>
    <text x="240" y="63" font-size="11" fill="#495057" text-anchor="middle">drawing-completed</text>
    <text x="240" y="79" font-size="10" fill="#868E96" text-anchor="middle">랙 급증</text>
    <line x1="295" y1="66" x2="340" y2="66" stroke="#495057" stroke-width="1.8" marker-end="url(#arw)"/>
    <rect x="340" y="44" width="110" height="44" rx="8" fill="#E6FCF5" stroke="#099268"/>
    <text x="395" y="63" font-size="11.5" font-weight="700" fill="#1A1B1E" text-anchor="middle">notif-1</text>
    <text x="395" y="79" font-size="10" fill="#495057" text-anchor="middle">단독 소비</text>

    <!-- lag curve A -->
    <text x="50" y="112" font-size="11" fill="#868E96">랙 곡선 (lag-a1.csv)</text>
    <polyline points="60,160 90,110 130,120 180,132 240,144 320,155 420,158" fill="none" stroke="#E8590C" stroke-width="2.2"/>
    <line x1="55" y1="160" x2="430" y2="160" stroke="#CED4DA"/>
    <text x="150" y="155" font-size="10" fill="#E8590C">느린 drain</text>
  </g>

  <!-- experiment B -->
  <g transform="translate(0,172)">
    <rect x="490" y="0" width="440" height="180" rx="12" fill="#F8F9FA" stroke="#DEE2E6"/>
    <text x="510" y="28" font-size="15" font-weight="700" fill="#1A1B1E">실험 B · notification × 3 (스케일 업)</text>

    <rect x="510" y="44" width="90" height="44" rx="8" fill="#F8F0FC" stroke="#9C36B5"/>
    <text x="555" y="63" font-size="11" fill="#495057" text-anchor="middle">동일 버스트</text>
    <text x="555" y="79" font-size="11" fill="#495057" text-anchor="middle">N건</text>
    <line x1="600" y1="66" x2="640" y2="66" stroke="#9C36B5" stroke-width="1.8" marker-end="url(#arwp)"/>
    <rect x="640" y="40" width="120" height="16" rx="4" fill="#E6FCF5" stroke="#099268"/>
    <text x="700" y="52" font-size="9.5" fill="#1A1B1E" text-anchor="middle">notif-1</text>
    <rect x="640" y="58" width="120" height="16" rx="4" fill="#E6FCF5" stroke="#099268"/>
    <text x="700" y="70" font-size="9.5" fill="#1A1B1E" text-anchor="middle">notif-2</text>
    <rect x="640" y="76" width="120" height="16" rx="4" fill="#E6FCF5" stroke="#099268"/>
    <text x="700" y="88" font-size="9.5" fill="#1A1B1E" text-anchor="middle">notif-3</text>
    <text x="700" y="106" font-size="10" fill="#868E96" text-anchor="middle">파티션 리밸런스 → 병렬 소비</text>

    <!-- lag curve B -->
    <text x="510" y="128" font-size="11" fill="#868E96">랙 곡선 (lag-b3.csv)</text>
    <polyline points="520,160 545,110 570,140 610,158 660,160" fill="none" stroke="#2F9E44" stroke-width="2.2"/>
    <line x1="515" y1="160" x2="890" y2="160" stroke="#CED4DA"/>
    <text x="700" y="150" font-size="10" fill="#2F9E44">빠른 drain</text>
  </g>

  <!-- report table -->
  <text x="30" y="392" font-size="15" font-weight="700" fill="#1A1B1E">결과 요약 (N per burst)</text>
  <g font-size="12">
    <rect x="30" y="404" width="900" height="34" fill="#F1F3F5" stroke="#DEE2E6"/>
    <text x="60" y="426" font-weight="700" fill="#495057">구성</text>
    <text x="250" y="426" font-weight="700" fill="#495057">주입 처리량</text>
    <text x="450" y="426" font-weight="700" fill="#495057">peak 랙</text>
    <text x="600" y="426" font-weight="700" fill="#495057">drawing_drain</text>
    <text x="790" y="426" font-weight="700" fill="#495057">전건 CONFIRMED</text>

    <rect x="30" y="438" width="900" height="34" fill="#FFFFFF" stroke="#DEE2E6"/>
    <text x="60" y="460" fill="#1A1B1E">notif×1</text>
    <text x="250" y="460" fill="#495057">≈ N/produce s</text>
    <text x="450" y="460" fill="#E8590C">높음</text>
    <text x="600" y="460" fill="#E8590C">느림 (기준선)</text>
    <text x="790" y="460" fill="#495057">A_DONE s</text>

    <rect x="30" y="472" width="900" height="34" fill="#FFFFFF" stroke="#DEE2E6"/>
    <text x="60" y="494" fill="#1A1B1E">notif×3</text>
    <text x="250" y="494" fill="#495057">동일 (비차단)</text>
    <text x="450" y="494" fill="#2F9E44">낮음</text>
    <text x="600" y="494" fill="#2F9E44">단축 ✔</text>
    <text x="790" y="494" fill="#495057">B_DONE s</text>
  </g>

  <rect x="30" y="524" width="900" height="90" rx="12" fill="#EBFBEE" stroke="#2F9E44"/>
  <text x="50" y="552" font-size="13" font-weight="700" fill="#2F9E44">③ 판정</text>
  <text x="50" y="576" font-size="12" fill="#495057">B_DRAIN &lt; A_DRAIN 이면 "notification 3개가 1개보다 drawing 랙을 더 빨리 소진" 확인 로그 출력</text>
  <text x="50" y="598" font-size="12" fill="#868E96">주입 처리량은 컨슈머 적체와 무관하게 유지 (프로듀서 비차단) · DB 병목이 상한일 수 있어 CSV/수치로 최종 판단</text>
</svg>
