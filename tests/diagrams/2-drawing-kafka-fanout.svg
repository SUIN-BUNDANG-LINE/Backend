<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#495057"/>
    </marker>
    <marker id="arwp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9C36B5"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#FBFCFE"/>

  <text x="30" y="40" font-size="24" font-weight="700" fill="#1A1B1E">② drawing-kafka-fanout — 추첨판 소진 → 설문 자동 종료 Fan-out</text>
  <text x="30" y="64" font-size="13" fill="#868E96">원본: DrawingKafkaIntegrationTest · 도메인 규칙: boardSize = targetParticipantCount, 추첨판이 소진돼야 종료(target 도달은 트리거 아님)</text>

  <!-- setup -->
  <rect x="30" y="96" width="200" height="96" rx="12" fill="#F1F3F5" stroke="#868E96"/>
  <text x="130" y="122" font-size="14" font-weight="700" fill="#1A1B1E" text-anchor="middle">setup()</text>
  <text x="130" y="145" font-size="11.5" fill="#495057" text-anchor="middle">설문 20개 생성</text>
  <text x="130" y="163" font-size="11.5" fill="#495057" text-anchor="middle">각 5명 응답 제출</text>
  <text x="130" y="181" font-size="11.5" fill="#495057" text-anchor="middle">→ 참가자 풀 100명</text>

  <line x1="230" y1="144" x2="290" y2="144" stroke="#495057" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- drawing phase -->
  <rect x="290" y="96" width="210" height="96" rx="12" fill="#EDF2FF" stroke="#3B5BDB"/>
  <text x="395" y="122" font-size="14" font-weight="700" fill="#1A1B1E" text-anchor="middle">drawingPhase</text>
  <text x="395" y="145" font-size="11.5" fill="#495057" text-anchor="middle">100명 동시 추첨</text>
  <text x="395" y="163" font-size="11.5" fill="#495057" text-anchor="middle">(20 VU · shared-iter)</text>
  <text x="395" y="181" font-size="11.5" fill="#E8590C" text-anchor="middle">각 설문 추첨판 소진</text>

  <line x1="500" y1="144" x2="560" y2="144" stroke="#495057" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- kafka topic -->
  <rect x="560" y="104" width="200" height="80" rx="12" fill="#F8F0FC" stroke="#9C36B5"/>
  <text x="660" y="132" font-size="14" font-weight="700" fill="#1A1B1E" text-anchor="middle">Kafka</text>
  <text x="660" y="153" font-size="11.5" fill="#495057" text-anchor="middle">drawing-completed</text>
  <text x="660" y="171" font-size="11" fill="#868E96" text-anchor="middle">partitions=6 · 설문별 발행</text>

  <!-- fan-out to consumer -->
  <text x="790" y="100" font-size="12" font-weight="700" fill="#9C36B5">fan-out</text>
  <line x1="760" y1="128" x2="830" y2="128" stroke="#9C36B5" stroke-width="1.8" marker-end="url(#arwp)"/>
  <line x1="760" y1="144" x2="830" y2="160" stroke="#9C36B5" stroke-width="1.8" marker-end="url(#arwp)"/>
  <line x1="760" y1="160" x2="830" y2="192" stroke="#9C36B5" stroke-width="1.8" marker-end="url(#arwp)"/>

  <rect x="830" y="112" width="110" height="90" rx="10" fill="#E6FCF5" stroke="#099268"/>
  <text x="885" y="140" font-size="12" font-weight="700" fill="#1A1B1E" text-anchor="middle">auto-close</text>
  <text x="885" y="159" font-size="11" fill="#495057" text-anchor="middle">consumer</text>
  <text x="885" y="182" font-size="11" fill="#495057" text-anchor="middle">설문 CLOSED</text>

  <!-- consumer closes surveys -->
  <path d="M885,202 C885,240 660,240 660,270" fill="none" stroke="#099268" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="700" y="238" font-size="11" fill="#099268">상태 전이</text>

  <!-- surveys row -->
  <text x="30" y="300" font-size="14" font-weight="700" fill="#1A1B1E">설문 20개 (teardown 라운드로빈 폴링 → 전부 CLOSED 대기)</text>
  <g font-size="10.5" text-anchor="middle">
    <!-- draw 20 small survey chips, 10 per row -->
    <g fill="#EBFBEE">
      <rect x="30"  y="316" width="82" height="30" rx="6" stroke="#2F9E44"/><rect x="122" y="316" width="82" height="30" rx="6" stroke="#2F9E44"/>
      <rect x="214" y="316" width="82" height="30" rx="6" stroke="#2F9E44"/><rect x="306" y="316" width="82" height="30" rx="6" stroke="#2F9E44"/>
      <rect x="398" y="316" width="82" height="30" rx="6" stroke="#2F9E44"/><rect x="490" y="316" width="82" height="30" rx="6" stroke="#2F9E44"/>
      <rect x="582" y="316" width="82" height="30" rx="6" stroke="#2F9E44"/><rect x="674" y="316" width="82" height="30" rx="6" stroke="#2F9E44"/>
      <rect x="766" y="316" width="82" height="30" rx="6" stroke="#2F9E44"/><rect x="858" y="316" width="82" height="30" rx="6" stroke="#2F9E44"/>
      <rect x="30"  y="352" width="82" height="30" rx="6" stroke="#2F9E44"/><rect x="122" y="352" width="82" height="30" rx="6" stroke="#2F9E44"/>
      <rect x="214" y="352" width="82" height="30" rx="6" stroke="#2F9E44"/><rect x="306" y="352" width="82" height="30" rx="6" stroke="#2F9E44"/>
      <rect x="398" y="352" width="82" height="30" rx="6" stroke="#2F9E44"/><rect x="490" y="352" width="82" height="30" rx="6" stroke="#2F9E44"/>
      <rect x="582" y="352" width="82" height="30" rx="6" stroke="#2F9E44"/><rect x="674" y="352" width="82" height="30" rx="6" stroke="#2F9E44"/>
      <rect x="766" y="352" width="82" height="30" rx="6" stroke="#2F9E44"/><rect x="858" y="352" width="82" height="30" rx="6" stroke="#2F9E44"/>
    </g>
    <g fill="#2F9E44" font-weight="700">
      <text x="71" y="336">CLOSED</text><text x="163" y="336">CLOSED</text><text x="255" y="336">CLOSED</text><text x="347" y="336">CLOSED</text><text x="439" y="336">CLOSED</text>
      <text x="531" y="336">CLOSED</text><text x="623" y="336">CLOSED</text><text x="715" y="336">CLOSED</text><text x="807" y="336">CLOSED</text><text x="899" y="336">CLOSED</text>
      <text x="71" y="372">CLOSED</text><text x="163" y="372">CLOSED</text><text x="255" y="372">CLOSED</text><text x="347" y="372">CLOSED</text><text x="439" y="372">CLOSED</text>
      <text x="531" y="372">CLOSED</text><text x="623" y="372">CLOSED</text><text x="715" y="372">CLOSED</text><text x="807" y="372">CLOSED</text><text x="899" y="372">CLOSED</text>
    </g>
  </g>

  <!-- expected -->
  <rect x="30" y="416" width="900" height="130" rx="12" fill="#F8F9FA" stroke="#DEE2E6"/>
  <text x="50" y="444" font-size="14" font-weight="700" fill="#1A1B1E">기대 결과</text>
  <text x="50" y="470" font-size="12.5" fill="#495057">• drawing_success_total ≥ 총 티켓수 − 5  (추첨판 전량 소진)</text>
  <text x="50" y="493" font-size="12.5" fill="#495057">• fanout_closed_total ≥ 설문수 − 1  (거의 전 설문이 자동 종료)</text>
  <text x="50" y="516" font-size="12.5" fill="#495057">• fanout_close_latency_ms 로 추첨 마감 → CLOSED 전파 지연 측정 (전체대기 ≈ 가장 느린 단일 설문)</text>
  <text x="50" y="538" font-size="12" fill="#868E96">멱등 close 검증: target 도달 경로와 추첨판 소진 경로가 동시 발화해도 CLOSED 는 1회만</text>
</svg>
