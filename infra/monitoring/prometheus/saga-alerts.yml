# SMS 발송-비용 사가 관측 알림 규칙.
# 분산 트랜잭션(사가)에서 가장 중요한 두 신호를 알림으로 잡는다:
#   1) 멈춘 사가 — PENDING 이 확정도 취소도 못 하고 갇힘 (조용히 사가를 깨는 1순위 위험)
#   2) 보상 과다 — REVERSED 비율 급증 (상류 SMS 게이트웨이 이상 신호)
groups:
    - name: sms-saga
      rules:
          - alert: StuckPendingSaga
            expr: max(cost_oldest_pending_age_seconds) > 600
            for: 2m
            labels:
                severity: critical
            annotations:
                summary: "SMS 사가가 PENDING 에 갇힘"
                description: "가장 오래된 PENDING 이 {{ $value | humanizeDuration }} 째 미해결 — 발송이 확정도 실패도 안 됨. 보상 경로(~5분)를 넘겼다면 조사 필요."

          - alert: HighCompensationRatio
            expr: sum(cost_records{state="REVERSED"}) / clamp_min(sum(cost_records{state="CONFIRMED"}) + sum(cost_records{state="REVERSED"}), 1) > 0.5
            for: 5m
            labels:
                severity: warning
            annotations:
                summary: "보상(REVERSED) 비율 과다"
                description: "확정 대비 취소 비율이 50% 초과 — 상류 SMS 게이트웨이 장애를 의심하라."
