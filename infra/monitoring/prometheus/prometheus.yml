# Prometheus 스크레이프 설정 — sulmun2yong cluster (P:2)
#
# 스크레이프 대상:
#   - Spring Boot Actuator (web-1, web-2) → /management/prometheus
#   - Kafka Exporter → /metrics
#
# 호스트명은 docker-compose.cluster.yml의 container_name을 따른다.
# :consumer 모듈은 sulmoon2yong-consumer 레포로 분리됨 — 해당 인스턴스는
# 별도 Prometheus 설정에서 스크레이프하거나 동일 Prometheus에 federation 한다.

global:
    scrape_interval: 15s
    scrape_timeout: 10s
    evaluation_interval: 15s
    external_labels:
        cluster: sulmun2yong-local

scrape_configs:
    # ────────── Spring Boot 인스턴스 5개 ──────────
    # 판정은 전부 카운터·히스토그램(_sum/_count/_bucket)으로 하므로 주기와 무관하다.
    # HikariCP active/pending 같은 게이지만 해상도를 타는데, 커넥션 압박은 이미
    # acquire_seconds 의 _sum/_count 로 정확히 재고 있어 게이지는 정황용이다.
    # CPU/RAM 은 실측 결과 노이즈 수준(전략 간 MySQL CPU 차 1.6%p, 첫 단계는 JIT 오염)이라
    # 관찰 세트에서 제외 — 5초 스크레이프·cAdvisor 도 함께 걷어냈다.
    - job_name: spring-apps
      metrics_path: /management/prometheus
      scrape_interval: 15s
      metric_relabel_configs:
          # Micrometer 가 타이머마다 자동으로 붙이는 _max 게이지는 감쇠 창(2~3분 실측)이
          # 실험 단계 간격(1분)보다 길어, 앞 단계의 최댓값이 다음 단계에 그대로 남는다.
          # 실험 지표는 _sum/_count 평균과 _bucket 분위수로만 읽으므로 저장하지 않는다.
          # (http_server_requests 등 다른 _max 는 이상치 관측용으로 남긴다)
          - source_labels: [__name__]
            regex: drawing_.*_seconds_max
            action: drop
      static_configs:
          - targets: [sulmun2yong-web-1:8080]
            labels:
                application: sulmun2yong-web
                instance: survey-drawing-1
          - targets: [sulmun2yong-web-2:8080]
            labels:
                application: sulmun2yong-web
                instance: survey-drawing-2

    # ────────── 도메인 서비스 4개 (게이트웨이·인증·결제·모금) → /management/prometheus ──────────
    - job_name: domain-services
      metrics_path: /management/prometheus
      scrape_interval: 15s
      # instance 를 짧은 이름으로 명시 - 미지정 시 "컨테이너명:8080" 이 그대로 노출되어
      # 대시보드 레전드가 web(web-1·web-2)과 표기 층위가 어긋난다
      static_configs:
          - targets: [sulmun2yong-gateway:8080]
            labels:
                application: gateway
                instance: gateway
          - targets: [sulmun2yong-auth:8080]
            labels:
                application: auth
                instance: auth
          - targets: [sulmun2yong-payment:8080]
            labels:
                application: payment
                instance: payment
          - targets: [sulmun2yong-cofunding:8080]
            labels:
                application: cofunding
                instance: cofunding

    # ────────── Kafka Exporter (외부 브로커 lag/offset) ──────────
    - job_name: kafka-exporter
      metrics_path: /metrics
      scrape_interval: 15s
      static_configs:
          - targets: [kafka-exporter:9308]
            labels:
                exporter: kafka-exporter

    # ────────── MySQL Exporter (InnoDB 행 락·데드락·롤백 — 분산락 전-후 DB 부하 비교) ──────────
    # 15초 유지 — 여기서 쓰는 지표는 전부 누적 카운터라 델타를 재는 이상 주기와 무관하다.
    # 오히려 SHOW GLOBAL STATUS 를 더 자주 던지면 실험 대상 DB 에 관측자가 부하를 더한다.
    - job_name: mysqld-exporter
      metrics_path: /metrics
      scrape_interval: 15s
      static_configs:
          - targets: [mysqld-exporter:9104]
            labels:
                exporter: mysqld-exporter
                instance: cluster-mysql

    # ────────── 파티션 확장 실험 브로커 (tests/partition-scaling) ──────────
    # 실험 스택이 내려가 있으면 target down — 무해. 10분짜리 실험이라 5s 로 해상도 확보.
    - job_name: partition-scaling-kafka
      metrics_path: /metrics
      scrape_interval: 5s
      static_configs:
          - targets: [pscale-kafka-exporter:9308]
            labels:
                exporter: kafka-exporter
                experiment: partition-scaling

    # ────────── 파티션 확장 실험 컨슈머 (무결성 게이지) ──────────
    # 실험 컨슈머 1번의 experiment_payload_sum·unique·duplicate. 실험 꺼져 있으면 down — 무해.
    - job_name: partition-scaling-consumer
      metrics_path: /management/prometheus
      scrape_interval: 5s
      static_configs:
          - targets: [pscale-consumer-1:8080]
            labels:
                experiment: partition-scaling

    # ────────── Prometheus 자체 메트릭 (디버깅용) ──────────
    - job_name: prometheus
      static_configs:
          - targets: [localhost:9090]
