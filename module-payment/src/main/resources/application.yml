spring:
    application:
        name: payment
    profiles:
        include:
            - secret
    jpa:
        hibernate:
            # 스키마 주인은 web 의 Flyway. payment 는 검증만 한다(컨슈머 모듈과 동일 규칙).
            ddl-auto: validate
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.MySQLDialect
        open-in-view: false
    flyway:
        enabled: false
    # redis 는 이 서비스가 쓰지 않는다 - :support 전이 의존으로 붙는 자동설정(헬스 포함)을 끈다
    autoconfigure:
        exclude:
            - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
            - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

management:
    endpoints:
        web:
            base-path: /management
            exposure:
                include: health, info, prometheus
            path-mapping:
                health: health
    metrics:
        tags:
            application: ${spring.application.name:payment}

server:
    port: 8082
