spring:
    application:
        name: payment
    profiles:
        include:
            - secret
    jpa:
        hibernate:
            # 스키마 주인은 web 의 Flyway. payment 는 검증만 한다(컨슈머 모듈과 동일 규칙).
            ddl-auto: validate
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.MySQLDialect
        open-in-view: false
    flyway:
        # 자기 스키마의 주인 - 서비스별 DB 라 각자 마이그레이션한다
        enabled: true
        baseline-on-migrate: true

management:
    endpoints:
        web:
            base-path: /management
            exposure:
                include: health, info, prometheus
            path-mapping:
                health: health
    metrics:
        tags:
            application: ${spring.application.name:payment}

server:
    port: 8082
