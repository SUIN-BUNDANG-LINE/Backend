spring:
    application:
        name: cofunding
    profiles:
        include:
            - secret
    jpa:
        hibernate:
            # 스키마 주인은 web 의 Flyway. cofunding 은 검증만 한다(컨슈머 모듈과 동일 규칙).
            ddl-auto: validate
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.MySQLDialect
        open-in-view: false
    flyway:
        # 자기 스키마의 주인 - 서비스별 DB 라 각자 마이그레이션한다
        enabled: true
        baseline-on-migrate: true

management:
    endpoints:
        web:
            base-path: /management
            exposure:
                include: health, info, prometheus
            path-mapping:
                health: health
    metrics:
        tags:
            application: ${spring.application.name:cofunding}

# 개설 API 가 쓰는 도메인 설정 (web 과 동일 값)
payment:
    reward-unit-price: 2000

frontend:
    base-url: http://localhost:3000

# 8081 은 web 로컬 bootRun 이 사용 - 모금은 8083 (게이트웨이 라우트 등록 시 이 값 기준)
server:
    port: 8083
